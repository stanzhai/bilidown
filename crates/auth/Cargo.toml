[package]
name = "auth"
description = "Bilibili auth stack: wbi signing, anonymous session provisioning, login flows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
network = { path = "../network" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "cookies"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
thiserror = "=2.0.17"
hmac = "=0.13.0"
sha2 = "=0.11.1"
rand = "=0.10.3"
md-5 = "=0.11.0"
digest = "=0.11.3"
parking_lot = "=0.12.5"

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "=3.27.0"
