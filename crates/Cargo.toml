[workspace]
resolver = "2"
members = ["app", "auth", "config", "database", "extras", "ffmpeg", "network", "parsers", "urls"]

[workspace.package]
edition = "2021"
version = "2.21.0"
license = "GPL-3.0"

[workspace.dependencies]
# gpui-kit pins an exact GPUI snapshot (`gpui-pre`); any snapshot may change
# GPUI's API, so both are pinned exactly (`=`, never `^`). Bump deliberately
# in a dedicated task. (spec: Maturity acknowledgment)
gpui-kit = "=0.7.3"
anyhow = "1"
parking_lot = "0.12"
libc = "0.2"
