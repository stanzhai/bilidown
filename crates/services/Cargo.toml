[package]
name = "services"
description = "Bili23 Downloader app services: i18n, theme, logs, clipboard, notifications, window state, teaching tips, terms gate, history, Verhub update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
config = { path = "../config" }
database = { path = "../database" }
network = { path = "../network" }
urls = { path = "../urls" }
anyhow.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "cookies"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
regex = "=1.13.1"
sys-locale = "=0.3.2"
thiserror = "=2.0.17"
libc.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "macros"] }
wiremock = "=0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_System_SystemInformation"] }
