[package]
name = "parsers"
description = "Bilibili parse layer: episode tree model and audio/batch/area parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
network = { path = "../network" }
auth = { path = "../auth" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.17"
regex = "=1.13.1"
parking_lot = "=0.12.5"
uuid = { version = "=1.28.0", features = ["v4"] }
tokio = { version = "=1.53.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "macros"] }
wiremock = "=0.6.5"
