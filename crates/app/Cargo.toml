[package]
name = "app"
description = "Bili23 Downloader application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bili23-downloader"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
parsers = { path = "../parsers" }
config = { path = "../config" }
urls = { path = "../urls" }
network = { path = "../network" }
auth = { path = "../auth" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread"] }
naming = { path = "../naming" }
services = { path = "../services" }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
