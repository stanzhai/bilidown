[package]
name = "app"
description = "Bili23 Downloader application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bili23-downloader"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
parsers = { path = "../parsers" }
config = { path = "../config" }
urls = { path = "../urls" }
network = { path = "../network" }
auth = { path = "../auth" }
tasks = { path = "../tasks" }
database = { path = "../database" }
services = { path = "../services" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread"] }
chrono = { version = "=0.4.45" }
dirs = "=6.0.0"

[dev-dependencies]
tempfile = "=3.27.0"
