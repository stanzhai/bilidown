[package]
name = "app"
description = "Bili23 Downloader application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bili23-downloader"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
auth = { path = "../auth" }
parsers = { path = "../parsers" }
config = { path = "../config" }
urls = { path = "../urls" }
network = { path = "../network" }
parking_lot.workspace = true
qrcode = "=0.14.1"
image = "=0.25.10"
open = "=5.4.4"
services = { path = "../services" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "=3.27.0"
