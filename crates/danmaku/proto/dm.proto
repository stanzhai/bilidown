syntax = "proto3";

package bilibili.community.service.dm.v1;

// Subset of Bilibili's dm.proto actually consumed by the danmaku segment
// fetch (src/util/misc/dm_pb2.py); field names/numbers/types verbatim.

message DanmakuElem {
  int64 id = 1;
  int32 stime = 2;       // ms
  int32 mode = 3;
  int32 size = 4;
  uint32 color = 5;
  string uhash = 6;
  string text = 7;
  int64 date = 8;
  int32 weight = 9;
  string action = 10;
  int32 pool = 11;
  string dmid = 12;
  int32 attr = 13;
  string animation = 22;
}

message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
}
