[package]
name = "danmaku"
description = "Danmaku pipeline: protobuf segment fetch via wbi-signed seg.so, decode, and xml/ass/json export with the native ASS renderer (all Danmaku Style options)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
network = { path = "../network" }
prost = "=0.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
thiserror = "=2.0.17"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.1.0"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "macros"] }
wiremock = "=0.6.5"
